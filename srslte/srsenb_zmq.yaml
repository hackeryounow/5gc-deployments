version: '3'
services:
  srsenb_zmq:
    image: swr.cn-north-4.myhuaweicloud.com/cn_5gc/docker_srslte:v23.11
    container_name: srsenb_zmq
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - ./config:/mnt/srslte
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - COMPONENT_NAME=enb_zmq
      # PLMN served by the open5gs core (subscription: imsi-460090000000001)
      - MCC=460
      - MNC=09
      # eNB local IP for S1AP / GTP-U, must equal the container IP below
      - SRS_ENB_IP=172.22.0.25
      # srsUE container IP, referenced by the eNB config
      - SRS_UE_IP=172.22.0.26
      # MME S1AP address, must match MME_IP in the open5gs 4G core deployment
      - MME_IP=172.22.0.6
    expose:
      - "36412/sctp"
      - "2152/udp"
      - "2000/tcp"
      - "2001/tcp"
    ports:
      - "2152:2152/udp"
    networks:
      default:
        ipv4_address: 172.22.0.25
networks:
  default:
    external:
      name: docker_open5gs_default
