version: "3.8"

# free5GC ULCL (Uplink Classifier) deployment
# Modeled after free5gc-compose/docker-compose-ulcl.yaml (tested layout:
# gNB1 -> I-UPF -> PSA-UPF), adapted to the local free5gc v4.2.3 images
# and the shared config/cert folders of this repository.
#
# Topology (config/ULCL/smfcfg.yaml + config/ULCL/uerouting.yaml):
#   default path    : gNB1 -> I-UPF -> PSA-UPF -> DN (UE pool 10.60.0.0/16)
#   specific path   : gNB1 -> I-UPF -> DN  (only for dest 1.0.0.1/32)
#
# Start : docker compose up -d
# UE    : docker exec -it ueransim bash -c "./nr-ue -c config/uecfg.yaml"

services:
  free5gc-i-upf:
    container_name: i-upf
    image: free5gc/upf:v4.2.3
    command: bash -c "./upf-iptables.sh && ./upf -c ./config/upfcfg.yaml"
    volumes:
      - ../config/ULCL/upfcfg-i-upf.yaml:/free5gc/config/upfcfg.yaml
      - ../config/upf-iptables.sh:/free5gc/upf-iptables.sh
    cap_add:
      - NET_ADMIN
    networks:
      privnet:
        aliases:
          - i-upf.free5gc.org

  free5gc-psa-upf:
    container_name: psa-upf
    image: free5gc/upf:v4.2.3
    command: bash -c "./upf-iptables.sh && ./upf -c ./config/upfcfg.yaml"
    volumes:
      - ../config/ULCL/upfcfg-psa-upf.yaml:/free5gc/config/upfcfg.yaml
      - ../config/upf-iptables.sh:/free5gc/upf-iptables.sh
    cap_add:
      - NET_ADMIN
    networks:
      privnet:
        aliases:
          - psa-upf.free5gc.org

  db:
    container_name: mongodb
    image: mongo:3.6.8
    command: mongod --port 27017 --quiet
    expose:
      - "27017"
    volumes:
      - dbdata:/data/db
    networks:
      privnet:
        aliases:
          - db

  free5gc-nrf:
    container_name: nrf
    image: free5gc/nrf:v4.2.3
    command: ./nrf -c ./config/nrfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ../config/nrfcfg.yaml:/free5gc/config/nrfcfg.yaml
      - ../cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - nrf.free5gc.org
    depends_on:
      - db

  free5gc-amf:
    container_name: amf
    image: free5gc/amf:v4.2.3
    command: ./amf -c ./config/amfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ../config/amfcfg.yaml:/free5gc/config/amfcfg.yaml
      - ../cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - amf.free5gc.org
    depends_on:
      - free5gc-nrf

  free5gc-ausf:
    container_name: ausf
    image: free5gc/ausf:v4.2.3
    command: ./ausf -c ./config/ausfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ../config/ausfcfg.yaml:/free5gc/config/ausfcfg.yaml
      - ../cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - ausf.free5gc.org
    depends_on:
      - free5gc-nrf

  free5gc-nssf:
    container_name: nssf
    image: free5gc/nssf:v4.2.3
    command: ./nssf -c ./config/nssfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ../config/nssfcfg.yaml:/free5gc/config/nssfcfg.yaml
      - ../cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - nssf.free5gc.org
    depends_on:
      - free5gc-nrf

  free5gc-pcf:
    container_name: pcf
    image: free5gc/pcf:v4.2.3
    command: ./pcf -c ./config/pcfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ../config/pcfcfg.yaml:/free5gc/config/pcfcfg.yaml
      - ../cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - pcf.free5gc.org
    depends_on:
      - free5gc-nrf

  free5gc-smf:
    container_name: smf
    image: free5gc/smf:v4.2.3
    command: ./smf -c ./config/smfcfg.yaml -u ./config/uerouting.yaml
    expose:
      - "8000"
    volumes:
      - ../config/ULCL/smfcfg.yaml:/free5gc/config/smfcfg.yaml
      - ../config/ULCL/uerouting.yaml:/free5gc/config/uerouting.yaml
      - ../cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - smf.free5gc.org
    depends_on:
      - free5gc-nrf
      - free5gc-i-upf
      - free5gc-psa-upf

  free5gc-udm:
    container_name: udm
    image: free5gc/udm:v4.2.3
    command: ./udm -c ./config/udmcfg.yaml
    expose:
      - "8000"
    volumes:
      - ../config/udmcfg.yaml:/free5gc/config/udmcfg.yaml
      - ../cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - udm.free5gc.org
    depends_on:
      - db
      - free5gc-nrf

  free5gc-udr:
    container_name: udr
    image: free5gc/udr:v4.2.3
    command: ./udr -c ./config/udrcfg.yaml
    expose:
      - "8000"
    volumes:
      - ../config/udrcfg.yaml:/free5gc/config/udrcfg.yaml
      - ../cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - udr.free5gc.org
    depends_on:
      - db
      - free5gc-nrf

  free5gc-chf:
    container_name: chf
    image: free5gc/chf:v4.2.3
    command: ./chf -c ./config/chfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ../config/chfcfg.yaml:/free5gc/config/chfcfg.yaml
      - ../cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - chf.free5gc.org
    depends_on:
      - db
      - free5gc-nrf
      - free5gc-webui

  free5gc-nef:
    container_name: nef
    image: free5gc/nef:latest
    command: ./nef -c ./config/nefcfg.yaml
    expose:
      - "8000"
    volumes:
      - ../config/nefcfg.yaml:/free5gc/config/nefcfg.yaml
      - ../cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - nef.free5gc.org
    depends_on:
      - db
      - free5gc-nrf

  free5gc-webui:
    container_name: webui
    image: free5gc/webui:v4.2.3
    command: ./webui -c ./config/webuicfg.yaml
    expose:
      - "2121"
      - "2122"
    volumes:
      - ../config/webuicfg.yaml:/free5gc/config/webuicfg.yaml
    environment:
      - GIN_MODE=release
    networks:
      privnet:
        aliases:
          - webui
    ports:
      - "5000:5000"
      - "2122:2122"
      - "2121:2121"
    depends_on:
      - db
      - free5gc-nrf

  ueransim:
    container_name: ueransim
    image: free5gc/ueransim:latest
    command: ./nr-gnb -c ./config/gnbcfg.yaml
    volumes:
      - ../config/gnbcfg.yaml:/ueransim/config/gnbcfg.yaml
      - ../config/uecfg-ulcl.yaml:/ueransim/config/uecfg.yaml
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun"
    networks:
      privnet:
        aliases:
          - gnb.free5gc.org
    depends_on:
      - free5gc-amf
      - free5gc-i-upf
      - free5gc-psa-upf

networks:
  privnet:
    ipam:
      driver: default
      config:
        - subnet: 10.100.200.0/24
    driver_opts:
      com.docker.network.bridge.name: br-free5gc

volumes:
  dbdata:
