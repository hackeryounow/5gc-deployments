# TLS-terminating proxy for the OAI CN5G TLS deployment.
#
# Background: in official OAI images (v2.2.0/v2.2.1/develop) only AMF and SMF
# implement TLS. When "enable_tls" is set they serve HTTPS but also force
# https:// toward every SBI peer, while NRF/AUSF/UDM still serve plain HTTP/2
# (h2c). This proxy terminates TLS on behalf of NRF/AUSF/UDM and forwards
# h2c to the real NF containers.
#
# Routing is done on the TLS SNI: AMF/SMF configs point their NRF/AUSF/UDM
# hosts at oai-nrf-tls / oai-ausf-tls / oai-udm-tls (aliases of this container).
# The oai-amf-tls alias fronts the AMF itself, because AMF/SMF build their
# callback URIs (smContextStatusUri, N1N2 transfer) from the configured hosts.

global
    log stdout format raw local0 info

defaults
    mode http
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend sbi_tls
    # one listener, certificate selected by SNI
    bind *:8080 ssl crt /etc/oai-certs/oai_nrf.pem crt /etc/oai-certs/oai_ausf.pem crt /etc/oai-certs/oai_udm.pem crt /etc/oai-certs/oai_amf.pem
    use_backend be_nrf  if { ssl_fc_sni oai-nrf-tls }
    use_backend be_ausf if { ssl_fc_sni oai-ausf-tls }
    use_backend be_udm  if { ssl_fc_sni oai-udm-tls }
    use_backend be_amf  if { ssl_fc_sni oai-amf-tls }
    default_backend be_nrf

backend be_nrf
    server nrf oai-nrf:8080 proto h2

backend be_ausf
    server ausf oai-ausf:8080 proto h2

backend be_udm
    server udm oai-udm:8080 proto h2

backend be_amf
    server amf oai-amf:8080 proto h2
