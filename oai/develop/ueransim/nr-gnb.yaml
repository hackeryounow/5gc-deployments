mcc: "208" # Mobile Country Code value
mnc: "95" # Mobile Network Code value (2 or 3 digits)

nci: "0x000000010" # NR Cell Identity (36-bit)
idLength: 32 # NR gNB ID length in bits [22...32]
tac: 0xa000 # Tracking Area Code (matches AMF plmn_support_list tac)

linkIp: 127.0.0.1 # gNB's local IP for Radio Link Simulation (UE runs in same container)
ngapIp: 172.20.0.141 # gNB's local IP for N2 Interface (container IP on demo-oai-public-net)
gtpIp: 172.20.0.141 # gNB's local IP for N3 Interface

# List of AMF address information (oai-amf static IP)
amfConfigs:
  - address: 172.20.0.4
    port: 38412

# List of supported S-NSSAIs by this gNB (OAI "custom_slice": sst 222, sd 00007B)
slices:
  - sst: 222
    sd: 0x00007B

# Indicates whether or not SCTP stream number errors should be ignored.
ignoreStreamIds: true
