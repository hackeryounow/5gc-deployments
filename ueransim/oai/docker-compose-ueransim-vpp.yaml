services:
    ueransim:
        container_name: ueransim
        image: rohankharade/ueransim:latest
        privileged: true
        environment:
            # GNB Congig Parameters
            - MCC=208
            - MNC=95
            - NCI=0x000000010
            - TAC=0xa000
            - LINK_IP=172.20.0.141
            - NGAP_IP=172.20.0.141
            - GTP_IP=172.20.0.141
            # AMF FQDN, resolved to an IP at startup (nr-gnb rejects hostnames in amfConfigs.address)
            - AMF_FQDN=oai-amf
            - SST=222
            - SD=123
            - IGNORE_STREAM_IDS=true
            # UE Config Parameters
            - NUMBER_OF_UE=1
            - IMSI=208950000000031
            - KEY=0C0A34601D4F07677303652C0462535B
            - OP=63bfa50ee6523365ff14c1f45f88737d
            - OP_TYPE=OPC
            - AMF_VALUE=8000
            - IMEI=356938035643803
            - IMEI_SV=0035609204079514
            - GNB_IP_ADDRESS=172.20.0.141
            - PDU_TYPE=IPv4
            - APN=oai
            - SST_0=222
            - SD_0=123
            - SST_C=222
            - SD_C=123
            - SST_D=222
            - SD_D=123
        # Resolve AMF_FQDN to an IP before running the original entrypoint,
        # because nr-gnb requires amfConfigs.address to be a valid IP address
        entrypoint: ["/bin/bash", "-c", "export NGAP_PEER_IP=$$(getent hosts $${AMF_FQDN} | awk '{print $$1}') && echo \"Resolved AMF ($${AMF_FQDN}) -> $$NGAP_PEER_IP\" && exec /ueransim/bin/entrypoint.sh"]
        networks:
            public_net:
                ipv4_address: 172.20.0.141
            # public_net_access:
            #     ipv4_address: 192.168.72.141
        healthcheck:
            test: /bin/bash -c "ifconfig uesimtun0"
            interval: 10s
            timeout: 5s
            retries: 5
# networks:
#     public_net:
#         name: demo-oai-public-net
#         external: True
#     public_net_access:
#         name: oai-public-access
#         external: True

networks:
    public_net:
        driver: bridge
        name: demo-oai-public-net
        ipam:
            config:
                - subnet: 172.20.0.0/16
        driver_opts:
            com.docker.network.bridge.name: "demo-oai"
